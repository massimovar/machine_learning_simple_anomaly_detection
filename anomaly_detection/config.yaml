# ============================================================================
# config.yaml — Central configuration for the anomaly detection project
# ============================================================================
# Every tuneable parameter lives here so you can experiment without touching
# code.  Each setting is documented with its purpose and sensible default.
# ============================================================================

# --- MQTT connection ----------------------------------------------------------
mqtt:
  broker_host: "mqtt-broker"        # hostname of the Mosquitto container (Docker Compose service name); env MQTT_BROKER_HOST
  broker_port: 1883                 # default MQTT port (unencrypted); env MQTT_BROKER_PORT
  sensor_topic: "ftoptix/paperclip/sensors"   # topic where FTOptix publishes sensor data
  alert_topic:  "anomaly/paperclip/alerts"    # topic where this app publishes anomaly alerts
  status_topic: "anomaly/paperclip/status"    # retained: where inference runs (CPU/NPU) + evidence
  command_topic: "anomaly/paperclip/cmd"      # HMI requests, e.g. {"cmd":"benchmark","runs":1000}
  benchmark_topic: "anomaly/paperclip/benchmark"  # CPU-vs-NPU benchmark results
  client_id: "anomaly-detector"     # MQTT client identifier

# --- Preprocessing ------------------------------------------------------------
preprocessing:
  window_size: 30       # number of samples to collect before running detection
                        # at 1 Hz, 30 samples = 30 seconds of data
  # The 10 sensor tag names, in order.  Must match the JSON keys in the MQTT payload.
  tag_names:
    - wire_feed_speed
    - wire_tension
    - motor_current_feed
    - motor_current_bend
    - bend_angle
    - cycle_time
    - vibration_rms
    - cut_force
    - temperature_motor
    - reject_count_per_min

# --- Model (Autoencoder) -----------------------------------------------------
model:
  scaler_path: "models/scaler.json"          # per-tag min/max of the training windows
  # Two files of the SAME network (training/train.py writes both).
  # The CPU runs float32; the NPU runs int8 (it computes in integers).
  # Each has its own threshold: int8 rounding slightly raises normal errors.
  float32:
    model_path: "models/autoencoder.tflite"
    threshold_path: "models/threshold.json"
  int8:
    model_path: "models/autoencoder_int8.tflite"
    threshold_path: "models/threshold_int8.json"
  # NPU acceleration (NXP i.MX 8M Plus, VeriSilicon VX delegate).
  # Falls back to the CPU (same int8 model) if the delegate cannot load or run.
  # Env overrides: USE_NPU=true|false, VX_DELEGATE_PATH=...
  # In Dockerfile.npu the entrypoint sets VX_DELEGATE_PATH=/opt/npu/lib/libvx_delegate.so
  # (a link to the device's delegate); the default below is where NXP's Yocto image installs it.
  use_npu: false
  vx_delegate_path: "/usr/lib/libvx_delegate.so"

# --- Training (used by training/train.py) ------------------------------------
training:
  hidden_size: 64       # neurons in the first/last hidden layers
  bottleneck_size: 16   # neurons in the compressed middle layer
                        # (input and output size = the number of tag_names)
  epochs: 100           # number of full passes over the training data
  learning_rate: 0.001  # Adam optimizer step size
  batch_size: 32        # samples per training batch
  threshold_sigma: 3.0  # threshold = mean(mse) + sigma * std(mse)
                        # 3.0 means the classic "three-sigma" rule
