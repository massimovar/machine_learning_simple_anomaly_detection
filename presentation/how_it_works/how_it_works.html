<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How it works — anomaly detection and gestures on OptixEdge</title>
<style>
:root{
  --bg:#0d1117; --panel:#141b24; --line:#253041; --text:#e6edf3; --soft:#8b98a9; --faint:#4a5668;
  --ftoptix:#b892ff; --broker:#8fa3b8; --image:#5ab0ff; --device:#f2b84b; --kernel:#ef6f6c; --volume:#4fd1b0;
  --anom:#ff4fa3; --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
body{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;grid-template-rows:48px minmax(0,1fr) auto;
  grid-template-areas:"top top top" "nav main side" "map map map";height:100vh;overflow:hidden}
body.stage{grid-template-columns:0 minmax(0,1fr) 0}
body.stage nav,body.stage aside{display:none}
header{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 span{color:var(--soft);font-weight:400}
.btn{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--soft)}
.btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
nav{grid-area:nav;overflow:auto;border-right:1px solid var(--line);padding:6px 0 14px}
nav .grp{padding:14px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
nav .it{padding:6px 14px;cursor:pointer;color:var(--soft);font-size:14px;display:flex;gap:10px;border-left:3px solid transparent}
nav .it b{font-weight:500;color:var(--faint);width:20px;text-align:right;font-variant-numeric:tabular-nums}
nav .it:hover{color:var(--text)}
nav .it.cur{color:var(--text);border-left-color:var(--image);background:#ffffff08}
main{grid-area:main;display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-width:0;min-height:0}
#wrap{position:relative;min-height:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#wrap:has(#controls button,#controls input) #stage{top:46px;height:calc(100% - 46px)}
#controls{position:absolute;top:10px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70%;align-items:center}
#controls input[type=range]{width:180px;accent-color:var(--image)}
#controls label{font-size:12px;color:var(--soft)}
#caption{padding:8px 24px 4px;font-size:19px;min-height:84px;line-height:1.35}
#caption small{display:block;color:var(--faint);font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
#caption b{color:#fff}
#bar{display:flex;align-items:center;gap:10px;padding:4px 16px 10px}
#bar input{flex:1;accent-color:var(--image)}
#beats{display:flex;gap:4px}
#beats i{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;display:block}
#beats i.done{background:var(--soft)} #beats i.cur{background:var(--image)}
#time{font:12px var(--mono);color:var(--soft);min-width:84px;text-align:right}
aside{grid-area:side;overflow:auto;border-left:1px solid var(--line);padding:6px 18px 18px}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:16px 0 5px}
aside p{margin:0 0 6px;color:#c9d3de}
aside ol{margin:0;padding-left:18px;color:#c9d3de} aside li{margin-bottom:6px}
aside code,#insp code{font:12.5px var(--mono);color:#fff;background:#ffffff0d;padding:0 3px;border-radius:3px}
#map{grid-area:map;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:7px 14px 8px}
#map .ttl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);align-self:flex-end;padding-bottom:4px;max-width:70px;line-height:1.2}
.mg{display:flex;flex-direction:column;gap:3px}
.mg>span{font-size:10px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.mg>div{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid currentColor;cursor:pointer;white-space:nowrap;opacity:.25;transition:opacity .3s;background:transparent;font-family:inherit}
.chip.on{opacity:1}
#insp{position:fixed;right:356px;bottom:90px;width:360px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 12px 40px #000a;display:none;z-index:5}
body.stage #insp{right:16px}
#insp.open{display:block}
#insp h4{margin:0 26px 4px 0;font-size:17px}
#insp .prov{font-size:12px;margin-bottom:8px}
#insp p{margin:6px 0;font-size:14px;color:#c9d3de}
#insp .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-top:10px}
#insp .x{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--soft);font-size:18px;cursor:pointer}
#insp .chip{opacity:1;margin:2px 3px 0 0;display:inline-block}
#hint{font-size:12px;color:var(--faint);padding:0 24px}
svg text{fill:var(--text);font-size:14px;font-family:system-ui,"Segoe UI",sans-serif}
svg .mono{font-family:var(--mono);white-space:pre}
svg .s{font-size:12px} svg .xs{font-size:10.5px} svg .l{font-size:18px} svg .xl{font-size:26px;font-weight:600}
svg .b{font-weight:600} svg .soft{fill:var(--soft)} svg .faint{fill:var(--faint)}
svg [data-part]{cursor:pointer}
svg [data-part]:hover>rect{stroke-width:2.6}
@media (max-width:1100px){body{grid-template-columns:200px minmax(0,1fr) 0} aside{display:none}}
@media (max-height:820px){#map .ttl,.mg>span{display:none} #map{gap:4px 8px;padding:5px 12px} .chip{font-size:10.5px}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <button class="btn" id="bAll"></button>
  <button class="btn" id="bLang">IT · EN</button>
  <button class="btn" id="bStage"></button>
</header>
<nav id="nav"></nav>
<main>
  <div id="wrap">
    <svg id="stage" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="controls"></div>
  </div>
  <div id="caption"></div>
  <div>
    <div id="bar">
      <button class="btn" id="bPlay">▶</button>
      <button class="btn" id="bReset" title="↺">↺</button>
      <input id="scrub" type="range" min="0" max="10" step="0.01" value="0">
      <div id="beats"></div>
      <span id="time"></span>
    </div>
    <div id="hint"></div>
  </div>
</main>
<aside id="side"></aside>
<div id="map"></div>
<div id="insp"></div>

<script>
"use strict";

   =================================================================== */
const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);

const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const P = (t, a, b) => ease(clamp((t - a) / (b - a)));            // eased progress of t in [a,b]
const frac = x => x - Math.floor(x);
const C = { ftoptix:"#b892ff", broker:"#8fa3b8", image:"#5ab0ff", device:"#f2b84b", kernel:"#ef6f6c",
  volume:"#4fd1b0", cpu:"#d7dde5", npu:"#ef6f6c", ok:"#4fd1b0", anom:"#ff4fa3", soft:"#8b98a9",
  faint:"#4a5668", line:"#253041", text:"#e6edf3", bg:"#0d1117" };

const S = { i:0, t:0, playing:false, all:false, lang:"it", states:{},
  reduced: matchMedia("(prefers-reduced-motion: reduce)").matches };

// numbers in the current language: decimal comma and space thousands in Italian
function N(v, d = 0) {
  let s = Math.abs(v).toFixed(d), [i, f] = s.split(".");

  return (v < 0 ? "−" : "") + i + (f ? (S.lang === "it" ? "," : ".") + f : "");
}
function E(tag, a, p) { const n = document.createElementNS(NS, tag); if (a) for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; }
function A(n, a) { for (const k in a) n.setAttribute(k, a[k]); return n; }
function O(n, v) { n.setAttribute("opacity", clamp(v).toFixed(3)); return n; }
function TX(p, x, y, s, a = {}) {
  a = Object.assign({}, a); if (a.fill) { a.style = (a.style || "") + "fill:" + a.fill; delete a.fill; }
  const n = E("text", Object.assign({ x, y }, a), p); n.textContent = s; return n; }
function G(p, a) { return E("g", a || {}, p); }
// a labelled box; label = string or [title, subtitle...]
function box(p, x, y, w, h, label, o = {}) {
  const g = G(p); if (o.part) g.setAttribute("data-part", o.part);
  const col = o.color || (o.part ? PROV[PARTS[o.part].prov].color : C.soft);
  g.r = E("rect", { x, y, width:w, height:h, rx:o.rx ?? 7, fill:o.fill || "#ffffff07", stroke:col, "stroke-width":1.4,
    "stroke-dasharray":o.dash || "" }, g);
  const lines = Array.isArray(label) ? label : [label];
  const fs = o.fs || 14, fs2 = fs - 2.5, H = fs + (lines.length - 1) * (fs2 * 1.3);

  if (!MK[id]) { MK[id] = 1; const m = E("marker", { id, viewBox:"0 0 10 10", refX:9, refY:5, markerWidth:7, markerHeight:7, orient:"auto-start-reverse" }, DEFS);
    E("path", { d:"M0,0L10,5L0,10z", fill:col }, m); }

function arrow(p, pts, o = {}) {

    "marker-end":o.noHead ? "" : mk(col), "stroke-dasharray":o.dash || "" }, p);
}
function along(pts, p) {                              // point at fraction p along a polyline
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); seg.push(d); tot += d; }

  for (let i = 0; i < seg.length; i++) { if (r <= seg[i] || i === seg.length - 1) { const q = seg[i] ? clamp(r / seg[i]) : 0;
    return [lerp(pts[i][0], pts[i+1][0], q), lerp(pts[i][1], pts[i+1][1], q)]; } r -= seg[i]; }

function kf(t, frames) {                              // eased keyframes [[time, value], ...]
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) if (t <= frames[i][0]) return lerp(frames[i-1][1], frames[i][1], P(t, frames[i-1][0], frames[i][0]));

function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function dot(p, x, y, r, col) { return E("circle", { cx:x, cy:y, r, fill:col }, p); }
function mv(n, x, y) { return A(n, { cx:x, cy:y }); }
function tr(n, x, y, s) { n.setAttribute("transform", `translate(${x},${y})` + (s != null ? ` scale(${s})` : "")); return n; }
function lineTo(p, x1, y1, x2, y2, col, w, dash) { return E("line", { x1, y1, x2, y2, stroke:col || C.line, "stroke-width":w || 1, "stroke-dasharray":dash || "" }, p); }

/* ===================================================================
   The moving parts: every component, where it lives, who it talks to
   =================================================================== */
const PROV = {
  ftoptix:{ color:C.ftoptix, name:{ it:"FTOptix (runtime sul device)", en:"FTOptix (runtime on the device)" } },
  broker: { color:C.broker,  name:{ it:"Container broker", en:"Broker container" } },
  image:  { color:C.image,   name:{ it:"Nell'immagine del detector", en:"Inside the detector image" } },
  device: { color:C.device,  name:{ it:"Prestato dal device (/usr/lib, sola lettura)", en:"Lent by the device (/usr/lib, read-only)" } },
  kernel: { color:C.kernel,  name:{ it:"Kernel e hardware del device", en:"Device kernel and hardware" } },
  volume: { color:C.volume,  name:{ it:"Volume nominato", en:"Named volume" } },

    calls:["main","nsm"], what:{ it:"Un ufficio postale: riceve messaggi su un <i>topic</i> e li consegna a chi è abbonato. Non calcola niente. Conserva i messaggi <i>retained</i> (lo stato) e pubblica il <i>Last Will</i> se il detector muore.",
    en:"A post office: it receives messages on a <i>topic</i> and delivers them to subscribers. It computes nothing. It keeps <i>retained</i> messages (the status) and publishes the <i>Last Will</i> if the detector dies." } },
  main:{ prov:"image", name:{ it:"main.py", en:"main.py" }, file:"anomaly_detection/src/main.py",
    calls:["buffer","scaler","engine","broker"], what:{ it:"Il direttore d'orchestra. Si abbona a sensori e comandi; passa ogni messaggio a SampleBuffer; ogni 30 s normalizza, chiede lo score a InferenceEngine e pubblica l'allarme. Pubblica anche lo stato (retained) e i risultati del benchmark. Sceglie il file: int8 se <code>USE_NPU</code>, altrimenti float32.",
    en:"The conductor. Subscribes to sensors and commands; hands every message to SampleBuffer; every 30 s it normalises, asks InferenceEngine for the score and publishes the alert. It also publishes the status (retained) and benchmark results. It picks the file: int8 if <code>USE_NPU</code>, else float32." } },
  buffer:{ prov:"image", name:{ it:"SampleBuffer", en:"SampleBuffer" }, file:"anomaly_detection/src/preprocessing.py",
    calls:[], what:{ it:"Accumula 30 campioni (30 s a 1 Hz). Restituisce <code>None</code> 29 volte, poi la media di ogni tag: un vettore di 10 numeri.",
    en:"Collects 30 samples (30 s at 1 Hz). Returns <code>None</code> 29 times, then the mean of each tag: a vector of 10 numbers." } },
  scaler:{ prov:"image", name:{ it:"scaler + normalise", en:"scaler + normalise" }, file:"models/scaler.json · src/preprocessing.py",
    calls:[], what:{ it:"Min e max di ogni tag, misurati sui dati di addestramento. <code>normalise</code> porta ogni valore in [0, 1]: (x − min) / (max − min).",
    en:"Min and max of each tag, measured on the training data. <code>normalise</code> maps each value to [0, 1]: (x − min) / (max − min)." } },
  engine:{ prov:"image", name:{ it:"InferenceEngine", en:"InferenceEngine" }, file:"anomaly_detection/src/model.py",

    en:"The AI core: loads the model, tries the NPU (delegate + warm-up) and if that fails falls back to the CPU with the reason in <code>npu_error</code>. <code>reconstruct()</code> quantizes, runs, dequantizes; <code>score()</code> computes the MSE." } },
  model:{ prov:"image", name:{ it:"Modello .tflite", en:".tflite model" }, file:"models/autoencoder_int8.tflite (7 064 B) · autoencoder.tflite (16 544 B)",
    calls:[], what:{ it:"Un file con grafo (4 FULLY_CONNECTED + 1 LOGISTIC) e pesi dell'autoencoder 10→64→16→64→10. int8 per l'NPU, float32 per la CPU. Addestrato sul PC, copiato nell'immagine.",
    en:"One file with the graph (4 FULLY_CONNECTED + 1 LOGISTIC) and the weights of the 10→64→16→64→10 autoencoder. int8 for the NPU, float32 for the CPU. Trained on the PC, copied into the image." } },
  entry:{ prov:"image", name:{ it:"npu_entrypoint.sh", en:"npu_entrypoint.sh" }, file:"anomaly_detection/tools/npu_entrypoint.sh",

    en:"Runs before Python. Links only the device's NPU libraries into <code>/opt/npu/lib</code>, puts them first on <code>LD_LIBRARY_PATH</code>, checks with <code>ldd</code>, borrows <code>tflite_runtime</code>, checks <code>/dev/galcore</code>, then <code>exec python src/main.py</code>." } },

  npu:{ prov:"kernel", name:{ it:"NPU VIP8000", en:"VIP8000 NPU" }, file:"NXP i.MX 8M Plus · 2.3 TOPS",

    en:"The neural-network accelerator. Native format int8 (uint8 inside). Our graph arrives as 4 FCL2, 3 RELU, 1 SIGMOID, 2 DATACONVERT." } },
  cpu:{ prov:"kernel", name:{ it:"CPU arm64", en:"arm64 CPU" }, file:"NXP i.MX 8M Plus · 4× Cortex-A53",
    calls:[], what:{ it:"Fa girare tutto il resto (FTOptix, broker, Python) e, senza NPU, anche il modello. Il motore CPU del detector usa 1 thread.",

  const chip = k => `<button class="chip" style="color:${PROV[PARTS[k].prov].color}" data-part="${k}">${L(PARTS[k].name)}</button>`;
  const inSteps = STEPS.map((s, j) => s.parts.includes(id) ? `<button class="chip" style="color:${C.text}" data-goto="${j}">${j + 1}. ${L(s.title)}</button>` : "").join("");
  $("#insp").innerHTML = `<button class="x" data-close>×</button><h4>${L(p.name)}</h4>
    <div class="prov" style="color:${PROV[p.prov].color}">● ${U("where")}: ${L(PROV[p.prov].name)}</div>
    <p>${L(p.what)}</p><div class="k">${U("file")}</div><p><code>${p.file}</code></p>
    ${p.calls.length ? `<div class="k">${U("calls")} →</div>${p.calls.map(chip).join("")}` : ""}
    ${by.length ? `<div class="k">← ${U("calledBy")}</div>${by.map(chip).join("")}` : ""}
    <div class="k">${U("steps")}</div>${inSteps}`;
  $("#insp").style.bottom = $("#map").offsetHeight + 12 + "px";
  $("#insp").classList.add("open");
}

/* ----- input ----- */
document.addEventListener("click", e => {
  const it = e.target.closest("#nav .it"); if (it) { S.playing = false; load(+it.dataset.i); return; }
  const b = e.target.closest("#beats i"); if (b) { S.t = +b.dataset.t; S.playing = false; draw(); return; }
  const g = e.target.closest("[data-goto]"); if (g) { S.playing = false; load(+g.dataset.goto); return; }
  if (e.target.closest("[data-close]")) { $("#insp").classList.remove("open"); return; }
  const p = e.target.closest("[data-part]"); if (p) { inspect(p.dataset.part); return; }
  if (!e.target.closest("#insp")) $("#insp").classList.remove("open");
});
$("#bPlay").onclick = () => { if (S.t >= cur.st.dur - .01) S.t = 0; S.playing = !S.playing; draw(); };
$("#bReset").onclick = () => { S.states[cur.st.id] = {}; S.playing = false; load(S.i); };
$("#scrub").oninput = e => { S.t = +e.target.value; S.playing = false; draw(); };
$("#bAll").onclick = () => toggleAll();
$("#bLang").onclick = () => toggleLang();
$("#bStage").onclick = () => { document.body.classList.toggle("stage"); chrome(); capKey = ""; draw(); };
function toggleAll() { S.all = !S.all; if (S.all) { if (S.t >= cur.st.dur - .01) S.t = 0; S.playing = true; } chrome(); capKey = ""; draw(); }
function toggleLang() { S.lang = S.lang === "it" ? "en" : "it"; $("#insp").classList.remove("open"); load(S.i, true); }
function stepBeat(d) { const b = cur.st.beats, k = beatAt(S.t) + d;
  if (k < 0) S.t = 0; else if (k >= b.length) { if (S.i < STEPS.length - 1) { S.playing = false; load(S.i + 1); return; } S.t = cur.st.dur; } else S.t = b[k][0];
  S.playing = false; draw(); }
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowRight") { S.playing = false; load(S.i + 1); }
  else if (k === "ArrowLeft") { S.playing = false; load(S.i - 1); }
  else if (k === "ArrowDown") stepBeat(1);
  else if (k === "ArrowUp") stepBeat(-1);
  else if (k === " ") $("#bPlay").click();
  else if (k === "Home") { S.t = 0; draw(); }
  else if (k === "f" || k === "F") $("#bStage").click();
  else if (k === "l" || k === "L") toggleLang();
  else if (k === "a" || k === "A") toggleAll();
  else if (k === "Escape") $("#insp").classList.remove("open");
  else if (/^[1-9]$/.test(k)) { S.playing = false; load(+k - 1); }
  else return;
  e.preventDefault();
});
window.addEventListener("hashchange", () => { const m = location.hash.match(/step-(\d+)/); if (m && +m[1] - 1 !== S.i) load(+m[1] - 1); });

let last = performance.now();
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (S.playing) {
    S.t += dt;
    if (S.t >= cur.st.dur) {
      S.t = cur.st.dur;
      if (S.all && S.i < STEPS.length - 1) { load(S.i + 1); S.playing = true; }
      else { S.playing = false; if (S.all) { S.all = false; chrome(); } }
    }
    draw();
  }
  requestAnimationFrame(tick);
}
const m0 = location.hash.match(/step-(\d+)/);
load(m0 ? +m0[1] - 1 : 0);
requestAnimationFrame(tick);
</script>
</body>
